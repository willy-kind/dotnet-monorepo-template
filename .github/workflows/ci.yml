name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so new advisories against unchanged packages still show up
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - run: dotnet build --no-restore

      - name: Check for vulnerable packages
        run: |
          dotnet list package --vulnerable --include-transitive --format json > vulnerable.json
          count=$(jq '[.projects[].frameworks[]? | (.topLevelPackages // []) + (.transitivePackages // []) | .[]] | length' vulnerable.json)
          if [ "$count" -gt 0 ]; then
            dotnet list package --vulnerable --include-transitive
            exit 1
          fi

      - name: Test with coverage
        run: dotnet test --no-build --results-directory TestResults --coverlet --coverlet-output-format cobertura

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: TestResults/**/*.cobertura.xml
          if-no-files-found: ignore

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            if ! sh .githooks/commit-msg "$RUNNER_TEMP/msg"; then
              echo "::error::Commit $sha does not follow Conventional Commits"
              failed=1
            fi
          done
          exit "$failed"
